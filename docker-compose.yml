services:
  app:
    build: .
    container_name: index
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dhisproject
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - CACHE_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - dhis_network

  redis:
    image: redis:7-alpine
    container_name: dhis_redis
    networks:
      - dhis_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    container_name: dhisproject_db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
        - "3303:3306"
    environment:
        MYSQL_DATABASE: dhisproject
        MYSQL_ROOT_PASSWORD: secret
        MYSQL_ROOT_HOST: "%"
    volumes:
        - dhis_db_data:/var/lib/mysql
    healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
        - dhis_network

networks:
    dhis_network:
        driver: bridge

volumes:
    dhis_db_data:
