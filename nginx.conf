user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zone: max 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen       80;
        server_name  localhost;

        # Security Headers to prevent common vulnerabilities
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP allows our site, any HTTPS connection (for Supabase/Fonts/Images), inline scripts and styles.
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            
            # Apply rate limiting (burst of 20 requests without delay)
            limit_req zone=mylimit burst=20 nodelay;

            # SPA Routing: Fixes the 404 issue when navigating directly to a route
            try_files $uri $uri/ /index.html;
        }

        # Error pages
        error_page 429 /429-redirect;
        location = /429-redirect {
            return 302 /error?code=429;
        }

        error_page 500 502 503 504 /50x-redirect;
        location = /50x-redirect {
            return 302 /error?code=500;
        }
    }
}
